<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학부모 상담 주간 예약 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --primary: #4f7df3;
      --primary-hover: #3b68dc;
      --primary-soft: #eef3ff;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    header h1 {
      font-size: 1.35rem;
      color: var(--text);
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* 탭 네비게이션 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 125, 243, 0.25);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 날짜 그룹 및 시간 슬롯 버튼 */
    .date-group {
      margin-bottom: 18px;
    }

    .date-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }

    .slot-btn {
      border: 1.5px solid var(--border);
      background: #ffffff;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .slot-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .slot-btn.selected {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .slot-btn.selected .slot-status {
      color: #e0e7ff;
    }

    .slot-btn:disabled {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .slot-time {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .slot-status {
      display: block;
      font-size: 0.78rem;
      margin-top: 2px;
      color: var(--success);
      font-weight: 600;
    }

    .slot-btn:disabled .slot-status {
      color: #94a3b8;
    }

    /* 폼 요소 */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #ffffff;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 125, 243, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 76px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.82rem;
      border-radius: 8px;
    }

    /* 배지 및 상태 표시 */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-open {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge-closed {
      background: #f1f5f9;
      color: var(--muted);
    }

    .badge-booked {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* 예약 조회 결과 카드 */
    .booking-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fafcff;
    }

    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    /* 교사 관리 테이블 */
    .teacher-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #ffffff;
    }

    .teacher-row.is-booked {
      background: #f8faff;
      border-color: #c7d7fe;
    }

    .teacher-info {
      flex: 1;
      min-width: 220px;
    }

    .memo-box {
      margin-top: 6px;
      padding: 8px 10px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 0.84rem;
      color: #334155;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
      font-size: 0.92rem;
    }

    .selected-banner {
      background: var(--primary-soft);
      border: 1px solid #c7d7fe;
      color: var(--primary-hover);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    @media (max-width: 540px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .slot-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌱 학부모 상담 주간 예약</h1>
      <p>원하시는 상담 날짜와 시간을 선택해 신청해 주세요. (1회 20분 진행)</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('book')">📅 상담 예약</button>
      <button class="tab-btn" onclick="switchTab('check')">🔍 내 예약 확인·취소</button>
      <button class="tab-btn" onclick="switchTab('teacher')">👩‍🏫 교사 관리</button>
    </div>

    <!-- 1. 학부모 상담 예약 탭 -->
    <section id="panel-book" class="panel active">
      <div class="card">
        <h2>
          <span>1. 상담 시간 선택</span>
          <button class="btn btn-sm" style="background:#f1f5f9; color:#334155;" onclick="loadOpenSlots()">🔄 새로고침</button>
        </h2>
        <div id="slots-container">
          <div class="empty-msg">상담 가능 시간을 불러오는 중입니다...</div>
        </div>
      </div>

      <div class="card" id="booking-form-card">
        <h2>2. 신청 정보 입력</h2>
        <div id="selected-slot-banner" class="selected-banner" style="display:none;"></div>

        <form id="booking-form" onsubmit="submitBooking(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="student-number">학생 번호 *</label>
              <input type="number" id="student-number" min="1" max="50" placeholder="예: 5" required />
            </div>
            <div class="form-group">
              <label for="student-name">학생 이름 *</label>
              <input type="text" id="student-name" placeholder="예: 김민준" required />
            </div>
            <div class="form-group">
              <label for="parent-phone">학부모 연락처 *</label>
              <input type="tel" id="parent-phone" placeholder="예: 010-1234-5678" required />
            </div>
            <div class="form-group">
              <label for="counsel-type">상담 방식 *</label>
              <select id="counsel-type" required>
                <option value="대면">대면 상담 (교실 방문)</option>
                <option value="전화">전화 상담</option>
              </select>
            </div>
            <div class="form-group full">
              <label for="pin-code">예약 조회·취소용 비밀번호 (숫자 4자리) *</label>
              <input type="password" id="pin-code" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="예: 1234 (예약 확인 시 필요)" required />
            </div>
            <div class="form-group full">
              <label for="memo">사전 상담 내용 (선택)</label>
              <textarea id="memo" placeholder="교우 관계, 학습 태도 등 미리 나누고 싶은 이야기가 있다면 적어 주세요."></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">상담 예약 신청하기</button>
        </form>
      </div>
    </section>

    <!-- 2. 내 예약 조회 및 취소 탭 -->
    <section id="panel-check" class="panel">
      <div class="card">
        <h2>내 예약 조회 및 취소</h2>
        <form onsubmit="searchMyBooking(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="check-name">학생 이름</label>
              <input type="text" id="check-name" placeholder="예: 김민준" required />
            </div>
            <div class="form-group">
              <label for="check-pin">비밀번호 (숫자 4자리)</label>
              <input type="password" id="check-pin" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="예: 1234" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">예약 내역 조회하기</button>
        </form>

        <div id="my-booking-result" style="margin-top: 16px;"></div>
      </div>
    </section>

    <!-- 3. 교사 관리 탭 -->
    <section id="panel-teacher" class="panel">
      <div class="card" id="teacher-login-box">
        <h2>교사 관리자 인증</h2>
        <form onsubmit="loginTeacher(event)">
          <div class="form-group">
            <label for="teacher-pw">교사 비밀번호 (초기값: 1234)</label>
            <input type="password" id="teacher-pw" placeholder="비밀번호 입력" required />
          </div>
          <button type="submit" class="btn btn-primary">관리 화면 열기</button>
        </form>
      </div>

      <div id="teacher-dashboard" style="display:none;">
        <div class="card">
          <h2>⏰ 상담 시간표 일괄 생성 (09:00 시작 · 20분 상담 + 5분 휴식)</h2>
          <form onsubmit="generateTeacherSlots(event)">
            <div class="form-grid">
              <div class="form-group">
                <label for="gen-date">상담 날짜</label>
                <input type="date" id="gen-date" required />
              </div>
              <div class="form-group">
                <label for="gen-end">마감 시간 (이 시간 전까지 생성)</label>
                <input type="time" id="gen-end" value="16:30" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">해당 날짜 시간표 생성하기</button>
          </form>
          <p style="font-size:0.82rem; color:var(--muted); margin-top:8px;">
            * 생성된 시간은 처음에 <strong>[닫힘]</strong> 상태입니다. 아래 목록에서 상담 가능한 시간만 클릭해 열어 주세요.
          </p>
        </div>

        <div class="card">
          <h2>
            <span>📋 전체 시간표 및 예약 현황</span>
            <button class="btn btn-sm" style="background:#f1f5f9; color:#334155;" onclick="loadTeacherSchedule()">🔄 새로고침</button>
          </h2>
          <div id="teacher-schedule-list"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ==========================================
    // 1. Supabase 연결 설정 (여기에 값을 붙여 넣으세요)
    // ==========================================
    const SUPABASE_URL = 'https://xnmyppziwowxcysnflvw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2lJ5Bdj2lCyr3XDFdPsVRA_6qwLlxRT';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 상태 변수
    let selectedSlot = null;
    let teacherPassword = '';

    // 요일 포맷 헬퍼 (예: 2026-11-23 (월))
    function formatDateKorean(dateStr) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${y}년 ${m}월 ${d}일 (${days[dt.getDay()]})`; }  // 시간 포맷 헬퍼 (HH:MM:SS -> HH:MM) function formatTime(timeStr) { return timeStr ? timeStr.slice(0, 5) : ''; }  // 탭 전환 function switchTab(tabName) { document.querySelectorAll('.tab-btn').forEach((btn, idx) => { const names = ['book', 'check', 'teacher']; btn.classList.toggle('active', names[idx] === tabName); }); document.querySelectorAll('.panel').forEach(panel => { panel.classList.remove('active'); }); document.getElementById(`panel-${tabName}`).classList.add('active');

      if (tabName === 'book') loadOpenSlots();
      if (tabName === 'teacher' && teacherPassword) loadTeacherSchedule();
    }

    // ==========================================
    // 2. 학부모용: 오픈된 상담 시간대 불러오기
    // ==========================================
    async function loadOpenSlots() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '<div class="empty-msg">시간표를 불러오는 중입니다...</div>';

      const { data, error } = await db
        .from('counseling_slots')
        .select('id, counsel_date, start_time, end_time, is_booked')
        .eq('is_open', true)
        .order('counsel_date', { ascending: true })
        .order('start_time', { ascending: true });

      if (error) {
        container.innerHTML = `<div class="empty-msg" style="color:var(--danger);">시간표를 불러오지 못했습니다:
